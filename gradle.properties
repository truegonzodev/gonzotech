org.gradle.jvmargs=-Xmx3G
# Демон НЕ отключать (0.3.37): с daemon=false каждый runClient стартует с холодной
# JVM и заново прогоняет конфигурацию/NFRT — минуты простоя. Тёплый демон + кэши
# дают повторный запуск почти сразу после compileJava.
org.gradle.daemon=true
# Кэш результатов задач и configuration cache (официально поддерживается ModDevGradle 2):
# конфигурация сборки не пересчитывается, если build.gradle/properties не менялись.
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.parallel=true

minecraft_version=1.21.4
minecraft_version_range=[1.21.4,1.21.8)
neo_version=21.4.157
neo_version_range=[21.4.157,)
loader_version_range=[4,)

parchment_minecraft_version=1.21.4
parchment_mappings_version=2025.02.16

